<style>


			.hwt-container {
				background-color: #f8f9fa;

			}



	

</style>
</head>
<body onLoad="convert()">


<div class="">
	<input type="submit" value="Calculate" onclick="convert();">
</div>
<div>
	<textarea class="myHighlight hwt-content" id="myCss" name="myCss" rows="10" cols="100">
	aclass="zxcv asdf b2k"
	bclass="zxcv2 asdf2 b2k2 arg"
	zxcv astdf b2k fox b2k2 b2k2 b2k2b2k2 b2k2 bargl
	</textarea>	
</div>



<script>
	var index = 0;
	var lst=[];
	$('.myHighlight').highlightWithinTextarea({
		highlight: lst
	});


	function convert(){
		// This effectively clears array lst:
		lst.length = 0
		index = 0;
		a=document.getElementById("myCss").value;
		// Get number of class="" in document.
		numClasses=(a.match(/class=/g)).length;
		console.log(numClasses);
		
		for (var i=0; i<numClasses; i++){
			// Get everything inside first class="" and put it in str.
			str = GetNextSubstring(index);	
			console.log(str);
			// Put all class atributes in an array.
			strSplit = str.split(" ");
			//  Put array elements in a list (without repetitions).
			strSplit.forEach( (cls)=>{if( cls.length>0 && lst.indexOf(cls)<0) lst.push(cls);})				
		}
		//console.log(lst);
	/*
		b=document.getElementById("myCss").value;
		for (var i=0; i<lst.length; i++){
			regex = new RegExp(lst[i], 'g');
			b=b.replace(regex,lst[i]);
		}
		
		document.getElementById("myCss").innerHTML = b;
	*/	
		$('.myHighlight').highlightWithinTextarea({
    highlight: lst
});
		console.log("Contents of lst[]:");
		for (var i=0; i<lst.length; i++){

			console.log(lst[i]);
		}
	}
	
	// Returns everything inside class="" in the first class found.
	// Also updates index to point to position of last double quote.
	function GetNextSubstring(currentIndex){
		index = a.indexOf('class=',currentIndex);
		//console.log(index+" "+a[index]);
		index1 = a.indexOf('\"',index);
		//console.log(index+" "+a[index1]);
		index2 = a.indexOf('\"',index1+1);
		//console.log(index+" "+a[index2]);
		
		substring = a.substring(index1+1, index2);
		index = index2;
		return substring;
	
	}


(function($) {
	$.fn.afterPaste = function(options) {
		var settings = {
			delay: 300,
			callback: function() {}
		};
		options = $.extend(settings, options);
		return this.each(function() {
			var $element = $(this);
			$element.on('paste', function() {
				setTimeout(options.callback, options.delay);
			});
		
		});
	};

})(jQuery);

$(function() {
	$(document).afterPaste({
		delay: 500,
		callback: function() {
			convert();
		}
	});

});
	
	
</script>
</body>
